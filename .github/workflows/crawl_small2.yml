name: 소형주2 크롤링

on:
  schedule:
    - cron: '30 2,7,12,17,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Python 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: pip install requests pandas openpyxl beautifulsoup4

    - name: 오리엔트정공
      run: python crawl.py 065500

    - name: 코아스
      run: python crawl.py 071950

    - name: 형지글로벌
      run: python crawl.py 308100

    - name: 아센디오
      run: python crawl.py 012170

    - name: 중앙첨단소재
      run: python crawl.py 051980

    - name: 결과 저장
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add data/*.xlsx
        git stash
        git pull --rebase origin main || true
        git stash pop || true
        git add data/*.xlsx
        git diff --staged --quiet || git commit -m "소형주2 업데이트 $(date '+%Y-%m-%d %H:%M')"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

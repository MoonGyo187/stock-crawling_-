name: 주식 크롤링

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 한국시간 오전 9시 (UTC 0시)
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v3

    - name: Python 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: pip install requests pandas openpyxl beautifulsoup4

    - name: 삼성전자 크롤링
      run: python crawl.py 005930

    - name: SK하이닉스 크롤링
      run: python crawl.py 000660

    - name: 결과 저장
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add *.xlsx
        git diff --staged --quiet || git commit -m "데이터 업데이트 $(date '+%Y-%m-%d')"
        git push

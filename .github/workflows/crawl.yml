name: 대형주 크롤링

on:
  schedule:
    - cron: '0 */3 * * *'  # 3시간마다 자동 실행
  workflow_dispatch:      # 수동 실행 버튼 활성화

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4  # 최신 버전으로 업데이트됨

    - name: Python 설치
      uses: actions/setup-python@v5  # 최신 버전으로 업데이트됨
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: pip install requests pandas openpyxl beautifulsoup4

    - name: 데이터 폴더 생성
      run: mkdir -p data

    - name: 삼성전자 수집
      run: python crawl.py 005930

    - name: SK하이닉스 수집
      run: python crawl.py 000660

    - name: 현대차 수집
      run: python crawl.py 005380

    - name: 결과 저장 및 푸시
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add data/*.xlsx
        # 변경사항이 있을 때만 커밋
        git diff --staged --quiet || (git commit -m "대형주 업데이트 $(date '+%Y-%m-%d %H:%M')" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: 대형주 크롤링

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Python 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: pip install requests pandas openpyxl beautifulsoup4

    - name: 삼성전자
      run: python crawl.py 005930

    - name: SK하이닉스
      run: python crawl.py 000660

    - name: 현대차
      run: python crawl.py 005380

    - name: 결과 저장
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git pull --rebase origin main || true
        git add data/*.xlsx
        git diff --staged --quiet || git commit -m "업데이트 $(date '+%Y-%m-%d %H:%M')"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
